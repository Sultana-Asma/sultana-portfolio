<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="600" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F121B" />
      <stop offset="50%" stop-color="#141824" />
      <stop offset="100%" stop-color="#090A0F" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="120" y1="100" x2="480" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad)" />
  <circle cx="300" cy="240" r="240" fill="url(#glow)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#1E2436" stroke-width="1" opacity="0.65">
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="360" x2="600" y2="360" />
    <line x1="0" y1="480" x2="600" y2="480" />
    <line x1="120" y1="0" x2="120" y2="600" />
    <line x1="240" y1="0" x2="240" y2="600" />
    <line x1="360" y1="0" x2="360" y2="600" />
    <line x1="480" y1="0" x2="480" y2="600" />
  </g>

  <!-- Outer Ring -->
  <circle cx="300" cy="245" r="118" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />
  <circle cx="300" cy="245" r="98" fill="#141824" stroke="url(#accentGrad)" stroke-width="2.5" />

  <!-- Minimal Avatar Silhouette -->
  <circle cx="300" cy="215" r="34" fill="url(#accentGrad)" opacity="0.9" />
  <path d="M236 305C236 274 264 256 300 256C336 256 364 274 364 305" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" />

  <!-- Monogram & Name Badge -->
  <rect x="130" y="405" width="340" height="84" rx="16" fill="#141824" stroke="#2E3752" stroke-width="1.5" />
  <text x="300" y="440" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">
    Sultana Asma Islam
  </text>
  <text x="300" y="468" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="13">
    CSE Student | Aspiring Front-End Developer
  </text>
</svg>
